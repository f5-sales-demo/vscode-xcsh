---
name: Knip

# Cross-module dead-code gate: unused files, exports and dependencies. Biome only
# flags unused symbols WITHIN a file, so orphaned modules are invisible to it.
# Kept as its own workflow (like semgrep.yml) because it is an independent gate.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: knip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  knip:
    name: Dead-code gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm ci

      # Config in knip.json declares the true entry points (extension main, the Vite
      # webview entry loaded from index.html, the test runners) and excludes
      # vendored/generated trees.
      - name: Knip
        run: npx --yes knip@6.29.0
