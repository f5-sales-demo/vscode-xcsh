---
name: Knip

# Cross-module dead-code report: unused files, exports and dependencies. Biome only
# flags unused symbols WITHIN a file, so orphaned modules are invisible to it.
#
# ADVISORY (`|| true`): this repo has a real existing backlog (see the tracking
# issue), so gating now would block every merge on pre-existing findings. Promote to
# a gate by dropping `|| true` once the backlog is cleared.
#
# Kept as its own workflow (like semgrep.yml) rather than a step in ci.yml: it is an
# independent report, and it keeps this change from touching an unrelated workflow.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: knip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  knip:
    name: Dead-code report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm ci

      # Config in knip.json declares the true entry points (extension main, the Vite
      # webview entry loaded from index.html, the test runners) and excludes
      # vendored/generated trees.
      - name: Knip (advisory)
        run: npx --yes knip@6.29.0 || true
