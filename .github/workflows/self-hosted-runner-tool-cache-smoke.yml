---
name: Self-hosted Runner Tool-Cache Smoke

on:
  workflow_dispatch:

# The smoke has no repository/API interaction: it proves only the immutable
# runner image and its private, per-job tool cache.
permissions: {}

concurrency:
  group: self-hosted-runner-tool-cache-smoke-${{ github.repository }}
  cancel-in-progress: false

jobs:
  tool-cache-smoke:
    name: Validate catalogued Node tool cache
    runs-on: managed-socketless
    timeout-minutes: 10
    steps:
      - name: Assert private cache and immutable image boundaries
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_RUNTIME_DIR:?RUNNER_RUNTIME_DIR must be set}"
          : "${RUNNER_TOOL_CACHE:?RUNNER_TOOL_CACHE must be set}"

          runtime_dir="$(realpath -m -- "$RUNNER_RUNTIME_DIR")"
          tool_cache="$(realpath -m -- "$RUNNER_TOOL_CACHE")"
          test "$tool_cache" = "$runtime_dir/_tool"
          test -f "$tool_cache/node/24.19.0/x64.complete"
          test -x "$tool_cache/node/24.19.0/x64/bin/node"
          test -f /opt/hostedtoolcache/node/24.19.0/x64.complete

          if touch /.vscode-xcsh-runner-smoke; then
            rm -f /.vscode-xcsh-runner-smoke
            echo "the runner root filesystem must be read-only" >&2
            exit 1
          fi
          if touch /opt/hostedtoolcache/.vscode-xcsh-runner-smoke; then
            rm -f /opt/hostedtoolcache/.vscode-xcsh-runner-smoke
            echo "the image tool cache must be read-only" >&2
            exit 1
          fi

          printf 'runtime tool cache: %s\n' "$tool_cache"
          stat -c '%A %U:%G %n' / /opt/hostedtoolcache "$tool_cache"

      - name: Verify catalogued Node and npm from the private tool cache
        shell: bash
        run: |
          set -euo pipefail
          node_root="$RUNNER_TOOL_CACHE/node/24.19.0/x64"
          test "$("$node_root/bin/node" --version)" = "v24.19.0"
          "$node_root/bin/npm" --version
          "$node_root/bin/npx" --version
